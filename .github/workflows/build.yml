name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

env:
  DISKPEEK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build
        run: nix develop -c bash -c "meson setup builddir && ninja -C builddir"

      - name: Create AppImage
        run: |
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -O /tmp/linuxdeploy
          chmod +x /tmp/linuxdeploy

          APPDIR=$PWD/AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps" "$APPDIR/usr/share/applications" "$APPDIR/usr/bin/lib/fonts"

          cp builddir/hfsbrowser "$APPDIR/usr/bin/"
          cp lib/fonts/ChicagoFLF.ttf "$APPDIR/usr/bin/lib/fonts/"
          cp packaging/diskpeek.desktop "$APPDIR/usr/share/applications/"
          cp packaging/diskpeek-256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/diskpeek.png"

          nix develop -c bash -c "/tmp/linuxdeploy --appimage-extract-and-run \
            --appdir '$APPDIR' \
            --desktop-file '$APPDIR/usr/share/applications/diskpeek.desktop' \
            --icon-file '$APPDIR/usr/share/icons/hicolor/256x256/apps/diskpeek.png' \
            --exclude-library 'libGL.so*' \
            --exclude-library 'libGLX.so*' \
            --exclude-library 'libGLdispatch.so*' \
            --exclude-library 'libEGL.so*' \
            --output appimage"

          mkdir -p dist
          mv *.AppImage dist/diskpeek-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: diskpeek-linux-appimage
          path: dist/diskpeek-x86_64.AppImage

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: brew install meson ninja

      - name: Build SDL3 static
        run: |
          git clone --depth 1 --branch release-3.2.14 https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build \
            -DCMAKE_INSTALL_PREFIX=$HOME/sdl3-static \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/SDL3/build -j$(sysctl -n hw.ncpu)
          cmake --install /tmp/SDL3/build

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$HOME/sdl3-static/lib/pkgconfig:$PKG_CONFIG_PATH"
          meson setup builddir
          ninja -C builddir

      - name: Determine architecture
        id: arch
        run: |
          ARCH=$(uname -m)
          [ "$ARCH" = "arm64" ] && ARCH="aarch64"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          mkdir -p dist
          cp builddir/hfsbrowser "dist/diskpeek-macOS-${{ steps.arch.outputs.arch }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: diskpeek-macos-${{ steps.arch.outputs.arch }}
          path: dist/diskpeek-macOS-*

  build-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-zlib

      - name: Build
        run: |
          meson setup builddir
          ninja -C builddir

      - name: Package
        run: |
          mkdir -p dist
          cp builddir/hfsbrowser.exe dist/diskpeek-windows-x86_64.exe
          # Bundle required DLLs
          ldd builddir/hfsbrowser.exe | grep ucrt64 | awk '{print $3}' | while read dll; do
            cp "$dll" dist/
          done
          # Also grab the font
          mkdir -p dist/lib/fonts
          cp lib/fonts/ChicagoFLF.ttf dist/lib/fonts/

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: diskpeek-windows-x86_64
          path: dist/*

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble release files
        run: |
          mkdir -p release

          # Linux AppImage
          cp artifacts/diskpeek-linux-appimage/diskpeek-x86_64.AppImage release/
          cd release && zip diskpeek-linux-x86_64.zip diskpeek-x86_64.AppImage ../README.md ../COPYING && rm diskpeek-x86_64.AppImage && cd ..

          # macOS binaries
          for dir in artifacts/diskpeek-macos-*; do
            cp "$dir"/diskpeek-macOS-* release/
          done
          cd release
          for f in diskpeek-macOS-*; do
            arch="${f#diskpeek-macOS-}"
            zip "diskpeek-macOS-${arch}.zip" "$f" ../README.md ../COPYING
            rm "$f"
          done
          cd ..

          # Windows
          cd artifacts/diskpeek-windows-x86_64
          zip -r ../../release/diskpeek-windows-x86_64.zip . ../../README.md ../../COPYING
          cd ../..

          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
